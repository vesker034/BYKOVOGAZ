<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Виртуальный тур — офис</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <link rel="stylesheet" href="tour.css">
</head>
<body>
  <div class="tour tour--pano">
    <header class="tour__bar">
      <p class="tour__badge" aria-hidden="true">360°</p>
      <div class="tour__meta">
        <h1 class="tour__title">Виртуальная экскурсия по офису</h1>
        <p class="tour__counter">Перетаскивайте мышью или пальцем · колёсико — масштаб</p>
      </div>
      <button type="button" class="tour__fs-btn" id="btn-fullscreen" aria-label="На весь экран">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </header>
    <div id="pano" class="tour__pano" role="application" aria-label="Панорама офиса 360 градусов"></div>
    <p class="tour__hint">Обзор open space: рабочие места, окна, зона хранения документов.</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script src="tour.js"></script>
</body>
</html>
